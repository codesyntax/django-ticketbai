[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-ticketbai"
version = "2.6"
description = "django-ticketbai allows to create, manage, store and send TicketBai invoices to the Basque tax authorities."
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Urtzi Odriozola", email = "uodriozola@codesyntax.com" },
]
requires-python = ">=3.11"
dependencies = [
    "pytbai>=1.8",
    "qrcode",
    "requests",
    "weasyprint==70.0",
    "crc8==0.2.1",
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
]

[project.urls]
Homepage = "https://github.com/codesyntax/django-ticketbai"
Repository = "https://github.com/codesyntax/django-ticketbai"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["django_ticketbai*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
django_ticketbai = ["templates/*"]
